version: 2
updates:
  # Native "bun" ecosystem: Dependabot resolves against Bun and updates the text-based
  # bun.lock (GA since Feb 2025). The "npm" ecosystem left bun.lock stale on stacked PRs,
  # breaking `bun install --frozen-lockfile` in CI.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
